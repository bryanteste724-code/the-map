name: Build THE map

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Android 64-bit
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.11.2
          target: Android64

      - name: Fix Geode version in package metadata
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import glob, json, os, tempfile, zipfile

          files = glob.glob(os.path.join("${{ steps.build.outputs.build-output }}", "*.geode"))
          if not files:
              raise SystemExit("Nenhum arquivo .geode encontrado")

          for path in files:
              with zipfile.ZipFile(path, "r") as src:
                  entries = [(info, src.read(info.filename)) for info in src.infolist()]

              fd, temp = tempfile.mkstemp(suffix=".geode", dir=os.path.dirname(path))
              os.close(fd)

              with zipfile.ZipFile(temp, "w") as dst:
                  for info, data in entries:
                      if info.filename == "mod.json":
                          meta = json.loads(data)
                          meta["geode"] = "v" + meta["geode"].lstrip("v")
                          meta["version"] = "5.11.2"
                          data = json.dumps(meta, indent=4).encode()
                      dst.writestr(info, data)

              os.replace(temp, path)
              print("Metadados corrigidos:", path)
          PYTHON

      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: THE-map-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
