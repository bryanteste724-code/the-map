name: Build THE map

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Android 64-bit
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          target: Android64

      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: THE-map-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
